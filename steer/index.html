<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Neuron Set Study</title>
<link rel="stylesheet" href="style.css?v=b5ff63c217">
</head>
<body>
<!-- ============================================================ start -->
<div id="start" class="screen">
  <div class="intro">
    <div class="introhead">
      <h1 data-t="title"></h1>
      <div class="lang"><button data-lang="ko" class="langbtn">한국어</button><button data-lang="en" class="langbtn">English</button></div>
    </div>
    <p class="lead" data-t="lead"></p>

    <ol class="steps" id="steps">
      <li class="step">
        <div class="ill ill1"><div class="mockclaim"><span data-t="ex1a"></span> <b data-t="ex1b"></b><span data-t="ex1c"></span></div></div>
        <div class="stepnum">1</div>
        <h3 data-t="s1t"></h3>
        <p data-t="s1d"></p>
      </li>
      <li class="step">
        <div class="ill ill2">
          <svg viewBox="0 0 240 112" aria-hidden="true">
            <rect width="240" height="112" fill="#eceff3"/>
            <rect x="88" y="0" width="64" height="112" fill="#d5d9df"/>
            <path d="M120 4 v12 M120 26 v12 M120 48 v12 M120 70 v12 M120 92 v12" stroke="#fff" stroke-width="2"/>
            <path d="M108 96 L108 40" stroke="#f08a4b" stroke-width="3.4" stroke-opacity=".75" stroke-linecap="round"/>
            <g fill="#f08a4b" fill-opacity=".75"><circle cx="108" cy="82" r="3"/><circle cx="108" cy="68" r="3"/><circle cx="108" cy="54" r="3"/><circle cx="108" cy="40" r="3"/></g>
            <path d="M108 96 C108 70 112 52 132 36 S168 18 196 14" fill="none" stroke="#3b6fd4" stroke-width="5" stroke-opacity=".75" stroke-linecap="round"/>
            <g fill="#3b6fd4" fill-opacity=".75"><circle cx="109" cy="74" r="3.6"/><circle cx="117" cy="52" r="3.6"/><circle cx="140" cy="31" r="3.6"/><circle cx="170" cy="19" r="3.6"/></g>
            <rect x="102" y="40" width="12" height="20" rx="2" fill="#f08a4b" stroke="#fff" stroke-width="1.5"/>
            <rect x="176" y="10" width="20" height="12" rx="2" fill="#3b6fd4" stroke="#fff" stroke-width="1.5" transform="rotate(-14 186 16)"/>
            <text x="20" y="100" font-size="10.5" font-weight="700" fill="#c2410c" data-t="illOrig"></text>
            <text x="166" y="44" font-size="10.5" font-weight="700" fill="#1d4ed8" data-t="illSteer"></text>
          </svg>
        </div>
        <div class="stepnum">2</div>
        <h3 data-t="s2t"></h3>
        <p data-t="s2d"></p>
      </li>
      <li class="step">
        <div class="ill ill3">
          <div class="mockq1"><span data-t="ex3q"></span><span class="mb on" data-t="yes"></span><span class="mb" data-t="no"></span></div>
          <div class="mockq3"><span class="mb" data-t="ex3r1"></span><span class="mb on" data-t="ex3r2"></span><span class="mb" data-t="ex3r3"></span></div>
          <div class="mocknext" data-t="next"></div>
        </div>
        <div class="stepnum">3</div>
        <h3 data-t="s3t"></h3>
        <p data-t="s3d"></p>
      </li>
    </ol>

    <ul class="legendbox" id="legendBox">
      <li><span class="sw sw-orig"></span><span data-t="lgOrig"></span></li>
      <li><span class="sw sw-steer"></span><span data-t="lgSteer"></span></li>
      <li><span class="dot"></span><span data-t="lgDots"></span></li>
      <li><span class="car"></span><span data-t="lgPlay"></span></li>
    </ul>
    <p class="keynote" data-t="keynote"></p>
    <ul class="meta" id="meta"></ul>

    <div class="idbox">
      <label for="annId" data-t="idLabel"></label>
      <div class="idrow">
        <input id="annId" autocomplete="off" spellcheck="false" placeholder="P01" maxlength="32" aria-describedby="idHint">
        <button id="startBtn" class="primary big" disabled data-t="start"></button>
      </div>
      <p id="idHint" class="hint" data-t="idHint"></p>
      <p class="hint" data-t="idResumeNote"></p>
      <p id="resumeNote" class="resume hidden"></p>
      <p id="idTaken" class="taken hidden"></p>
    </div>
  </div>
</div>

<!-- ============================================================ trial -->
<div id="trial" class="screen hidden">
  <header class="bar">
    <span id="stageTag" class="tag"></span>
    <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
    <span id="progressText" class="ptext"></span>
    <span id="syncBadge" class="sync hidden"></span>
    <button id="helpBtn" class="ghost small" data-t="help"></button>
  </header>
  <main class="trialbody">
    <section class="top">
      <div class="claimbox" id="claimBox">
        <div class="claim" id="claimLine"></div>
        <div class="claimtask" id="claimTask"></div>
      </div>
      <div class="egobox" id="egoBox">
        <span class="egorow"><span data-t="egoSpeed"></span> <b id="egoSpeed"></b> <span id="egoUnit">km/h</span></span>
        <span class="egorow"><span data-t="egoCmd"></span> <b id="egoCmd"></b></span>
        <span class="legend-mini"><span class="sw sw-orig"></span><span data-t="lgOrigS"></span><span class="sw sw-steer"></span><span data-t="lgSteerS"></span></span>
        <button id="replayBtn" class="ghost small" data-t="replay"></button>
      </div>
      <figure class="cam" id="camBox"><img id="cam" alt=""><figcaption data-t="camCap"></figcaption></figure>
    </section>
    <section id="panels" class="panels"></section>
    <div id="feedback" class="feedback hidden"></div>
    <footer class="nav" id="navBox">
      <button id="prevBtn" class="ghost" data-t="prev"></button>
      <div class="q3" id="q3Box">
        <span class="q3label" id="q3Label"></span>
        <p id="safetyNote" class="claimsafety"></p>
        <div id="q3btns" class="q3btns" role="radiogroup"></div>
        <p id="tieNote" class="tienote"></p>
      </div>
      <button id="nextBtn" class="primary big" data-t="next"></button>
    </footer>
    <div class="belownav"><p id="nextHint" class="nexthint"></p><p class="keys" data-t="keys"></p></div>
  </main>
</div>

<!-- ============================================================ survey -->
<div id="survey" class="screen hidden">
  <div class="intro narrow">
    <h1 data-t="svTitle"></h1>
    <p class="lead" data-t="svLead"></p>
    <div id="svForm" class="survey"></div>
    <label class="svfree"><span data-t="svFree"></span><textarea id="comment" rows="3"></textarea></label>
    <p id="svHint" class="nexthint"></p>
    <div class="row">
      <button id="svBack" class="ghost" data-t="svBack"></button>
      <button id="svSubmit" class="primary big" data-t="svSubmit" disabled></button>
    </div>
  </div>
</div>

<!-- ============================================================ done -->
<div id="done" class="screen hidden">
  <div class="intro narrow center">
    <div class="bigcheck">✓</div>
    <h1 data-t="doneTitle"></h1>
    <p id="doneText"></p>
    <p id="doneSync" class="syncline hidden"></p>
    <div class="row">
      <button id="retryBtn" class="primary hidden" data-t="retry"></button>
      <button id="dlBtn" class="primary" data-t="download"></button>
      <button id="homeBtn" class="ghost" data-t="home"></button>
    </div>
    <p id="dlNote" class="hint"></p>
  </div>
</div>

<!-- ============================================================ overlays -->
<div id="helpModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalcard">
    <h2 data-t="helpTitle"></h2>
    <div id="helpSteps"></div>
    <div id="helpLegend"></div>
    <p class="keynote" data-t="keynote"></p>
    <div class="row end">
      <button id="tourBtn" class="ghost" data-t="tourAgain"></button>
      <button id="helpClose" class="primary" data-t="close"></button>
    </div>
  </div>
</div>

<div id="practiceModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalcard center">
    <div class="bigcheck">✓</div>
    <h2 data-t="practiceDoneTitle"></h2>
    <p id="practiceDoneText"></p>
    <button id="practiceGo" class="primary big" data-t="practiceDoneGo"></button>
  </div>
</div>

<div id="tour" class="tour hidden">
  <div class="tourhole" id="tourHole"></div>
  <div class="tourtip" id="tourTip" role="dialog">
    <div class="tourstep" id="tourStep"></div>
    <p id="tourText"></p>
    <div class="row end">
      <button id="tourSkip" class="ghost small" data-t="tourSkip"></button>
      <button id="tourNext" class="primary small"></button>
    </div>
  </div>
</div>

<script src="config.js?v=2608ae7cce"></script>
<script src="data/manifest.js?v=43a2a60e8e"></script>
<script src="core.js?v=fc119a5aee"></script>
<script src="app.js?v=0f468052e4"></script>
</body>
</html>
