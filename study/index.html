<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Driving Decision Study</title>
<link rel="stylesheet" href="style.css?v=c3be2c5b49">
</head>
<body>
<!-- ============================================================ start -->
<div id="start" class="screen">
  <div class="intro">
    <div class="introhead">
      <h1 data-t="title"></h1>
      <div class="lang"><button data-lang="ko" class="langbtn">한국어</button><button data-lang="en" class="langbtn">English</button></div>
    </div>
    <p class="lead" data-t="lead"></p>
    <p id="smallScreen" class="notice phone hidden" data-t="smallScreen"></p>

    <ol class="steps" id="steps">
      <li class="step">
        <div class="ill ill1"><div class="mockdecision"><span data-t="ex1a"></span> <b data-t="ex1b"></b></div></div>
        <div class="stepnum">1</div>
        <h3 data-t="s1t"></h3>
        <p data-t="s1d"></p>
      </li>
      <li class="step">
        <div class="ill ill2">
          <svg viewBox="0 0 240 110" aria-hidden="true">
            <rect width="240" height="110" fill="#cfd8e3"/>
            <rect y="0" width="240" height="46" fill="#e8eef5"/>
            <path d="M0 110 L95 46 L145 46 L240 110 Z" fill="#8c96a3"/>
            <path d="M120 50 L120 58 M120 66 L120 76 M120 86 L120 100" stroke="#f5f5f5" stroke-width="2.5"/>
            <rect x="104" y="52" width="32" height="22" rx="4" fill="#3b5b7d"/>
            <rect x="108" y="56" width="24" height="7" rx="2" fill="#a9c0d6"/>
            <rect x="183" y="40" width="2.5" height="44" fill="#6b7280"/>
            <path d="M177.5 24 h8 l5.5 5.5 v8 l-5.5 5.5 h-8 l-5.5 -5.5 v-8 z" fill="#c62828" stroke="#fff" stroke-width="1.2"/>
            <rect x="101" y="49" width="38" height="28" rx="2" fill="none" stroke="var(--r1)" stroke-width="2.2"/>
            <circle cx="101" cy="49" r="7" fill="var(--r1)" stroke="#fff" stroke-width="1.5"/>
            <text x="101" y="52.5" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">1</text>
            <rect x="166" y="18" width="31" height="31" fill="var(--r2)" fill-opacity=".15" stroke="var(--r2)" stroke-width="2" stroke-dasharray="4 3"/>
            <circle cx="166" cy="18" r="7" fill="var(--r2)" stroke="#fff" stroke-width="1.5"/>
            <text x="166" y="21.5" font-size="9.5" font-weight="700" fill="#fff" text-anchor="middle">2</text>
            <path d="M120 60 l0 13 l3.5-3.5 l2.5 5.5 l2.4-1.1 l-2.5-5.4 l5 0 z" fill="#111" stroke="#fff" stroke-width="1"/>
            <path d="M196 48 l0 13 l3.5-3.5 l2.5 5.5 l2.4-1.1 l-2.5-5.4 l5 0 z" fill="#111" stroke="#fff" stroke-width="1"/>
            <text x="120" y="93" font-size="10.5" font-weight="700" fill="var(--r1)" stroke="#fff" stroke-width="3" paint-order="stroke" text-anchor="middle" data-t="illClick"></text>
            <text x="216" y="70" font-size="10.5" font-weight="700" fill="var(--r2)" stroke="#fff" stroke-width="3" paint-order="stroke" text-anchor="middle" data-t="illDrag"></text>
          </svg>
        </div>
        <div class="stepnum">2</div>
        <h3 data-t="s2t"></h3>
        <p data-t="s2d"></p>
      </li>
      <li class="step">
        <div class="ill ill3">
          <div class="mockchips"><span class="chip on" data-t="cVehicle"></span><span class="chip" data-t="cPed"></span><span class="chip" data-t="cEtc"></span></div>
          <div class="mockseg"><span data-t="unsure"></span><span data-t="moderate"></span><span class="on" data-t="certain"></span></div>
          <div class="mocknext" data-t="next"></div>
        </div>
        <div class="stepnum">3</div>
        <h3 data-t="s3t"></h3>
        <p data-t="s3d"></p>
      </li>
    </ol>

    <p class="keynote" data-t="keynote"></p>
    <ul class="meta" id="meta"></ul>

    <div class="idbox">
      <label for="annotator" data-t="idLabel"></label>
      <div class="idrow">
        <input id="annotator" autocomplete="off" spellcheck="false" placeholder="A01" maxlength="32"
               aria-describedby="idHint">
        <button id="startBtn" class="primary big" disabled data-t="start"></button>
      </div>
      <p id="idHint" class="hint" data-t="idHint"></p>
      <p class="hint" data-t="idResumeNote"></p>
      <p id="resumeNote" class="resume hidden"></p>
      <p id="idTaken" class="taken hidden"></p>
    </div>
  </div>
</div>

<!-- ============================================================ task -->
<div id="task" class="screen hidden">
  <header class="bar">
    <span id="stageTag" class="tag"></span>
    <div class="progress" aria-hidden="true"><div id="progressFill"></div></div>
    <span id="progressText" class="ptext"></span>
    <span id="syncBadge" class="sync hidden"></span>
    <button id="helpBtn" class="ghost small" data-t="help"></button>
  </header>
  <div id="rotateHint" class="rotate hidden" data-t="rotate"></div>
  <div id="decMini" class="decmini" aria-hidden="true"></div>
  <main class="taskgrid">
    <div class="views">
      <section class="view p2" id="cmpSec">
        <div class="viewhead"><span data-t="s2Head"></span></div>
        <p class="s2note" data-t="s2Both"></p>
        <div id="cmpOpts" class="cmpopts" role="radiogroup"></div>
      </section>
      <section class="view p1" id="camSec">
        <div class="viewhead"><span data-t="camera"></span>
          <button id="replayBtn" class="ghost small" data-t="replay"></button>
          <button id="loupeBtn" class="ghost small" aria-pressed="false"></button>
          <span id="holdHint" class="holdhint hidden" data-t="holdHint"></span>
          <span id="replayLabel" class="replaylabel"></span></div>
        <div class="imgwrap" id="camWrap"><img id="camImg" alt=""><canvas id="camCanvas"></canvas>
          <div class="camlabels" aria-hidden="true"><span style="left:13.28%" data-t="camL"></span><span style="left:50%" data-t="camF"></span><span style="left:86.72%" data-t="camR"></span></div></div>
      </section>
      <section class="view bevsec p1" id="bevSec">
        <div class="viewhead"><span data-t="bev"></span></div>
        <div class="bevrow">
          <div class="imgwrap" id="bevWrap"><img id="bevImg" alt=""><canvas id="bevCanvas"></canvas></div>
          <ul class="legend">
            <li><span class="sw ego"></span><span data-t="lgEgo"></span></li>
            <li><span class="sw veh"></span><span data-t="lgVeh"></span></li>
            <li><span class="sw ped"></span><span data-t="lgPed"></span></li>
            <li class="lgnote" data-t="lgNote"></li>
          </ul>
        </div>
      </section>
    </div>

    <aside class="side" id="side">
      <div class="decision" id="decisionBox">
        <div class="declabel" data-t="decLabel"></div>
        <div class="decword" id="decision"></div>
        <div class="ego" id="ego"></div>
      </div>
      <div class="sidesec p2" id="choiceSec">
        <h3 data-t="s2Q"></h3>
        <div class="choices" id="choices" role="radiogroup"></div>
        <p class="hint" data-t="s2Hint"></p>
      </div>
      <div class="sidesec p1" id="clickSec">
        <h3><span data-t="yourClicks"></span> <span class="count" id="clickCount"></span></h3>
        <ol id="clickList" class="clicklist"></ol>
        <p id="clickEmpty" class="empty" data-t="clickHint"></p>
        <label class="none"><input type="checkbox" id="noneBox"> <span data-t="none"></span></label>
      </div>
      <p class="keys p1" data-t="keys"></p>
      <div class="sidesec p1" id="confSec">
        <h3 data-t="confidence"></h3>
        <div class="seg" id="conf" role="radiogroup">
          <label><input type="radio" name="conf" value="unsure"><span data-t="unsure"></span></label>
          <label><input type="radio" name="conf" value="moderate"><span data-t="moderate"></span></label>
          <label><input type="radio" name="conf" value="certain"><span data-t="certain"></span></label>
        </div>
      </div>
      <div class="sidesec nav">
        <button id="prevBtn" class="ghost" data-t="prev"></button>
        <button id="nextBtn" class="primary big" data-t="next"></button>
      </div>
      <p id="nextHint" class="nexthint"></p>
      <p class="keys p2" data-t="keys2"></p>
    </aside>
  </main>
</div>

<!-- ============================================================ background survey -->
<div id="survey" class="screen hidden">
  <div class="intro narrow">
    <h1 data-t="svTitle"></h1>
    <p class="lead" data-t="svLead"></p>
    <div id="svForm" class="survey"></div>
    <p id="svHint" class="nexthint"></p>
    <div class="row">
      <button id="svBack" class="ghost" data-t="back"></button>
      <button id="svSubmit" class="primary big" data-t="svSubmit" disabled></button>
    </div>
  </div>
</div>

<!-- ============================================================ done -->
<div id="done" class="screen hidden">
  <div class="intro narrow center">
    <div class="bigcheck">✓</div>
    <h1 data-t="doneTitle"></h1>
    <p id="doneText"></p>
    <p id="doneSync" class="syncline hidden"></p>
    <div class="row">
      <button id="retryBtn" class="primary hidden" data-t="retry"></button>
      <button id="downloadBtn" class="primary" data-t="download"></button>
      <button id="backBtn" class="ghost" data-t="back"></button>
    </div>
  </div>
</div>

<!-- ============================================================ overlays -->
<div id="helpModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalcard">
    <h2 data-t="helpTitle"></h2>
    <div id="helpSteps"></div>
    <p class="keynote" data-t="keynote"></p>
    <div class="row end">
      <button id="tourBtn" class="ghost" data-t="tourAgain"></button>
      <button id="helpClose" class="primary" data-t="close"></button>
    </div>
  </div>
</div>

<div id="stageModal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalcard center">
    <div class="bigcheck">✓</div>
    <h2 data-t="practiceDoneTitle"></h2>
    <p id="practiceDoneText"></p>
    <button id="stageGo" class="primary big" data-t="practiceDoneGo"></button>
  </div>
</div>

<div id="stage2Modal" class="modal hidden" role="dialog" aria-modal="true">
  <div class="modalcard center">
    <div class="bigcheck">2</div>
    <h2 data-t="s2Title"></h2>
    <p id="s2IntroText"></p>
    <p class="lockline" data-t="s2Lock"></p>
    <button id="stage2Go" class="primary big" data-t="s2Go"></button>
  </div>
</div>

<div id="tour" class="tour hidden">
  <div class="tourhole" id="tourHole"></div>
  <div class="tourtip" id="tourTip" role="dialog">
    <div class="tourstep" id="tourStep"></div>
    <p id="tourText"></p>
    <div class="row end">
      <button id="tourSkip" class="ghost small" data-t="tourSkip"></button>
      <button id="tourNext" class="primary small"></button>
    </div>
  </div>
</div>

<div id="catPop" class="catpop hidden" role="menu"></div>
<div id="toast" class="toast hidden" role="status"></div>
<canvas id="loupe" class="loupe hidden" width="300" height="180" aria-hidden="true"></canvas>

<script src="config.js?v=2608ae7cce"></script>
<script src="data/manifest.js?v=b516b94c16"></script>
<script src="core.js?v=fc119a5aee"></script>
<script src="app.js?v=9738ba0849"></script>
</body>
</html>
